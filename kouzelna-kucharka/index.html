<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kouzelná kuchařka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- DOMŮ -->
<section id="home" class="screen active">
  <header class="title">
    <h1>Kouzelná <span>kuchařka</span></h1>
    <p>Přečti, co příšerka chce, a nakrm ji!</p>
  </header>
  <div class="worlds" id="worlds"></div>
  <div class="home-buttons">
    <button class="btn big" id="btn-zoo">🏡 Moje příšerky</button>
    <button class="btn ghost" id="btn-parent">⚙️ Rodič</button>
  </div>
</section>

<!-- HRA -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="btn round" id="btn-back">←</button>
    <div class="progress"><div class="bar" id="bar"></div><span id="bar-text"></span></div>
    <button class="btn round" id="btn-speak" title="Přečti mi to">🔊</button>
  </div>
  <div class="stage">
    <div class="monster-wrap" id="monster-wrap">
      <div class="monster" id="monster"></div>
      <div class="monster-name" id="monster-name"></div>
    </div>
    <div class="bubble" id="bubble"><span id="word"></span></div>
  </div>
  <div class="choices" id="choices"></div>
</section>

<!-- ZOO -->
<section id="zoo" class="screen">
  <div class="topbar"><button class="btn round" id="btn-zoo-back">←</button><h2>Moje příšerky</h2><span></span></div>
  <div class="zoo-grid" id="zoo-grid"></div>
</section>

<!-- Modal: level hotov -->
<div class="modal" id="modal-done">
  <div class="card">
    <div class="confetti">🎉</div>
    <h2 id="done-title">Příšerka je plná!</h2>
    <p id="done-text"></p>
    <div class="modal-buttons">
      <button class="btn big" id="btn-next">Další příšerka</button>
      <button class="btn ghost" id="btn-home">Domů</button>
    </div>
  </div>
</div>

<!-- Modal: rodič -->
<div class="modal" id="modal-parent">
  <div class="card parent">
    <div id="parent-gate">
      <h2>Pro rodiče</h2>
      <p>Kolik je <b id="gate-q"></b>?</p>
      <input type="number" id="gate-a" inputmode="numeric">
      <div class="modal-buttons"><button class="btn big" id="gate-ok">OK</button><button class="btn ghost" id="gate-cancel">Zpět</button></div>
    </div>
    <div id="parent-panel" hidden>
      <h2>Nastavení</h2>
      <label><input type="checkbox" id="opt-syll"> Ukazovat slabiky (MA-SO)</label>
      <label><input type="checkbox" id="opt-tts"> Předčítat nahlas (🔊)</label>
      <label><input type="checkbox" id="opt-sound"> Zvuky</label>
      <label><input type="checkbox" id="opt-unlock"> Odemknout všechny levely</label>
      <label>Jídel na příšerku: <input type="number" id="opt-goal" min="3" max="20"></label>
      <h3>Vlastní slova</h3>
      <p class="hint">Slabiky odděl pomlčkou, např. <code>ba-bič-ka</code>. Emoji nebo obrázek: vlož emoji.</p>
      <div class="row"><input id="cw-word" placeholder="slo-vo"><input id="cw-emoji" placeholder="🧸" maxlength="8"><button class="btn" id="cw-add">+</button></div>
      <ul id="cw-list"></ul>
      <div class="modal-buttons">
        <button class="btn ghost danger" id="btn-reset">Smazat postup</button>
        <button class="btn big" id="parent-close">Hotovo</button>
      </div>
    </div>
  </div>
</div>

<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
